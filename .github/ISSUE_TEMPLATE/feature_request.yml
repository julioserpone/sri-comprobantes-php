name: Solicitud de funcionalidad
description: Proponga una mejora o un nuevo caso de uso
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de proponer, revise el alcance en el README y los ADRs. Este
        paquete no implementa un firmador XAdES-BES ni generadores de XML.
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Qué necesita resolver y por qué.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
      description: API, comportamiento o documentación deseada.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Fuente oficial
      description: Ficha (sección/página), WSDL o resolución que respalde el cambio.
  - type: dropdown
    id: scope
    attributes:
      label: Ámbito
      options:
        - Transporte / clientes
        - Clave de acceso / XML / XSD
        - Firma
        - Errores / estados
        - Persistencia
        - Documentación
        - Otro
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmación
      options:
        - label: Entiendo que los cambios del SRI deben citar fuente y fecha.
          required: true
        - label: No incluí secretos ni datos personales.
          required: true
