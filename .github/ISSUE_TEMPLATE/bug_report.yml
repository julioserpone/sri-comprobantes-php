name: Reporte de error
description: Algo no funciona como se documenta
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. **No incluya certificados, claves, contraseñas,
        XML reales ni datos fiscales/personales.** Para vulnerabilidades use el
        reporte privado de Security.
  - type: input
    id: version
    attributes:
      label: Versión del paquete
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: Versión de PHP
      placeholder: "8.2.0"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Ambiente
      options:
        - Pruebas / certificación
        - Producción
        - Solo local (sin SRI)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Qué esperaba y qué ocurrió.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir
      description: Use datos ficticios. No pegue XML real.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs o mensajes (sin secretos)
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmación
      options:
        - label: Confirmo que no incluí secretos, certificados ni datos personales.
          required: true
        - label: Verifiqué que no es un rechazo de negocio del SRI (código de error documentado).
          required: true
